name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  closure:
    name: import closure
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Closure gate self-test
        run: lean --run scripts/CheckClosure.lean --self-test

      - name: Every TrustLean module is in the default import closure
        run: lean --run scripts/CheckClosure.lean

  axioms-self-test:
    name: axiom gate self-test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Planted native_decide, bv_decide, sorry and axiom theorems fail the gate
        run: lean --run scripts/CheckAxioms.lean --self-test

  vacuity-self-test:
    name: vacuity gate self-test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Planted collisions, unrelated errors and compiling files fail the gate
        run: lean --run scripts/CheckVacuity.lean --self-test

  build:
    name: lake build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Fetch the Mathlib cache
        run: lake exe cache get

      - name: Build the default target
        run: lake build

      - name: Gate theorems depend only on propext, Classical.choice, Quot.sound
        run: lake env lean --run scripts/CheckAxioms.lean

      - name: The proof that VarNameInjective is false stops compiling
        run: lake env lean --run scripts/CheckVacuity.lean

      - name: Planted cast spellings and wrapping semantics fail the C differential harness
        run: lake env lean --run scripts/CheckCDiff.lean --self-test

      - name: Printed casts and operators compute what the evaluators say under clang and UBSan
        run: lake env lean --run scripts/CheckCDiff.lean

      - name: Undeclared locals, stmtToC, doubled condition parentheses, unsuffixed uint32_t literals, narrowed locals, unread parameters, macro parameter names and undefined skipped operands fail the typed C harness
        run: lake env lean --run scripts/CheckTypedC.lean --self-test

      - name: Every emitted C program compiles under clang -Wall -Werror and typed programs compute what evalTyped says
        run: lake env lean --run scripts/CheckTypedC.lean

      - name: int64_t declarations, the unbounded model and a wrapped undefined shift fail the uint32_t array harness
        run: lake env lean --run scripts/CheckS32C.lean --self-test

      - name: Printed uint32_t statements over an array compute what evalS32 says under clang and UBSan
        run: lake env lean --run scripts/CheckS32C.lean

      - name: A wrong expected value fails the minimal export example
        run: lake env lean --run examples/Export.lean --self-test

      - name: The minimal export example's C, built with cc -std=c11 -Wall -Werror, prints what ImpStmt.eval computes
        run: lake env lean --run examples/Export.lean

      - name: Planted cast spellings fail the Rust cast harness
        run: lake env lean --run scripts/CheckRustCasts.lean --self-test

      - name: Printed Rust casts compile under rustc and compute what the evaluators say
        run: lake env lean --run scripts/CheckRustCasts.lean

      - name: Build Tests
        run: lake build Tests
